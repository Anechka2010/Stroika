    <!-- ИСПРАВЛЕНО: Правильный скрипт Bootstrap 5, чтобы мобильное меню открывалось по клику -->
    <script src="https://jsdelivr.net"></script>
    <!-- Этот скрипт принудительно оживит кнопку меню на любых телефонах -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var toggler = document.querySelector('.navbar-toggler');
        var menu = document.querySelector('#navbarSupportedContent');
        
        if (toggler && menu) {
          toggler.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            menu.classList.toggle('show'); // Принудительно выкатывает шторку меню
          });
        }
      });
