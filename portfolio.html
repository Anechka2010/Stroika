<script>
function moveBentoSlide(button, direction) {
    // 1. Находим карточку (.bento-item), в которой кликнули стрелку
    const bentoItem = button.closest('.bento-item');
    if (!bentoItem) return;

    // 2. Находим внутри этой карточки все слайды и активный слайд
    const slides = bentoItem.querySelectorAll('.carousel-item');
    const activeSlide = bentoItem.querySelector('.carousel-item.active');
    
    if (!slides.length || !activeSlide) return;

    // 3. Получаем индекс текущего активного слайда
    let currentIndex = Array.from(slides).indexOf(activeSlide);

    // 4. Убираем класс active у текущего слайда
    activeSlide.classList.remove('active');

    // 5. Высчитываем индекс следующего слайда в зависимости от направления
    if (direction === 'next') {
        currentIndex = (currentIndex + 1) % slides.length; // если дошли до конца, вернется к первому
    } else if (direction === 'prev') {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length; // если в начале, уйдет к последнему
    }

    // 6. Добавляем класс active новому слайду
    slides[currentIndex].classList.add('active');
}</script>
